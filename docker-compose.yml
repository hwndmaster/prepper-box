# Builds the images (publish-docker.ps1) and can run them locally. On the server the shared app host runs
# them instead, from Deployment/app.json.
services:
  prepper-box-api:
    build:
      context: .                          # Root, so all projects are in scope
      dockerfile: PrepperBox.WebApi/Dockerfile
      secrets:
        - atom_pkg_access_token
    container_name: prepper-box-api
    ports:
      - "5095:8045"                       # Host port 5095 → container port 8045
    volumes:
      - C:/Dev/Src/prepper-box-docker-data:/app/Data      # Persist SQLite database
      - C:/Dev/Src/prepper-box-docker-logs:/app/Logs      # Logs
    environment:
      # Same variable names as Deployment/.env.example, so one set of keys works in both .env files.
      - Telegram__BotToken=${PREPPER_BOX_TELEGRAM_BOT_TOKEN:-}
      - Telegram__ChatId=${PREPPER_BOX_TELEGRAM_CHAT_ID:-}
      - ImageSearch__SerpApiKey=${PREPPER_BOX_SERPAPI_KEY:-}
      # The shared app host's OTLP port, when one runs on this machine. Without it the exporter drops the
      # telemetry and the API runs as usual.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:21100
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=prepper-box-api
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop resolves it by itself; a Linux daemon does not
    restart: unless-stopped

  prepper-box-web:
    build:
      context: ./PrepperBox.Web
      dockerfile: Dockerfile
      secrets:
        - atom_pkg_access_token
    container_name: prepper-box-web
    ports:
      - "5096:8046"                         # Host port 5096 → container port 8046 (HTTP)
      - "5097:8443"                         # Host port 5097 → container port 8443 (HTTPS)
    volumes:
      - ./certs:/etc/nginx/certs:ro         # Mount SSL certificates
    depends_on:
      - prepper-box-api
    restart: unless-stopped

secrets:
  atom_pkg_access_token:
    environment: ATOM_PKG_ACCESS_TOKEN
