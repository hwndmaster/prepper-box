# PrepperBox server deployment.
#
# Unlike the repo-root docker-compose.yml (which BUILDS the images for local work), this file runs the
# published images on a server, and it starts exactly ONE service: the Aspire app host. The app host's
# DCP orchestrator then creates the api and web containers itself on the same Docker daemon, which is
# what populates the dashboard's Resources page with startable/stoppable resources — a dashboard-only
# app host has no resource model and shows that page empty.
#
# Run from this directory:
#   docker compose --env-file .env up -d
#
# The project name is fixed so container and network names are predictable across restarts.
name: prepper-box

services:
  prepper-box-apphost:
    image: ghcr.io/hwndmaster/prepper-box-apphost:${PREPPER_BOX_IMAGE_TAG:-latest}
    container_name: prepper-box-apphost
    ports:
      - "15191:15191"                       # Aspire dashboard UI
      - "21192:21192"                       # OTLP/gRPC ingest
      - "21193:21193"                       # OTLP/HTTP ingest (the SPA's traces and logs, via nginx)
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:15191
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:21192
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:21193

      # deployed = DCP owns the containers (full Resources page).
      # external = compose owns them and the app host only reports them; switch to this, remove the
      #            docker.sock mount below and uncomment the api/web services if DCP cannot drive the
      #            container runtime on this host. No rebuild needed, it is only configuration.
      AppHost__Mode: deployed

      # Must match the `name:` above. Docker Desktop groups containers by the compose project label, and
      # the app host stamps this one onto the containers it creates so the whole stack shows up as a
      # single project instead of the app host and its containers appearing as two unrelated ones.
      Deployment__ComposeProject: prepper-box
      Deployment__Registry: ${PREPPER_BOX_REGISTRY:-ghcr.io/hwndmaster}
      Deployment__ImageTag: ${PREPPER_BOX_IMAGE_TAG:-latest}
      # nginx in the web container proxies /otlp/ back to this app host. DCP owns the network its
      # containers sit on and this app host is not on it, so that hop goes over the host gateway to the
      # OTLP/HTTP port published below. /api/ needs no override: both managed containers share DCP's
      # network and resolve each other by name.
      Deployment__WebOtlpUpstream: ${PREPPER_BOX_OTLP_UPSTREAM:-http://host.docker.internal:21193}
      # Missing: DCP creates the containers from the images update.ps1 pulled on the host, with your login.
      # Always makes DCP pull for itself, and it runs the docker CLI in THIS container, where that login
      # does not exist - so the pull goes out anonymous and a private registry answers
      # "error from registry: unauthorized". The socket mount grants the daemon, not the credentials.
      Deployment__ImagePullPolicy: ${PREPPER_BOX_IMAGE_PULL_POLICY:-Missing}
      # DCP publishes its own endpoints on 127.0.0.1 with no way to override it, so the app host adds a
      # second, reachable publish at this address. 127.0.0.1 here makes the app local-only.
      Deployment__BindAddress: ${PREPPER_BOX_BIND_ADDRESS:-0.0.0.0}
      # Host the dashboard's resource links are shown under - the address browsers reach this machine by,
      # which the app host cannot find out from inside its container. Deliberately no default here:
      # DeploymentSettings holds the only one (localhost), so the two cannot disagree.
      Deployment__PublicHost: ${PREPPER_BOX_PUBLIC_HOST:-}
      Deployment__ApiPort: "${PREPPER_BOX_API_PORT:-5095}"
      # PrepperBox only: the web image also serves HTTPS from mounted certificates. A host path again,
      # since the host's daemon resolves it. Required: nginx declares the HTTPS server unconditionally
      # and will not start without server.crt and server.key.
      Deployment__CertsPath: ${PREPPER_BOX_CERTS_PATH:?PREPPER_BOX_CERTS_PATH must be set (see .env.example)}
      Deployment__WebHttpsPort: "${PREPPER_BOX_WEB_HTTPS_PORT:-5097}"
      Deployment__WebPort: "${PREPPER_BOX_WEB_PORT:-5096}"
      # PrepperBox only: the integration secrets the app host hands on to the api container — the SerpApi
      # key for the product image search, and the Telegram bot for the expiration notifications. Each
      # one left unset keeps its integration disabled.
      Deployment__SerpApiKey: ${PREPPER_BOX_SERPAPI_KEY:-}
      Deployment__TelegramBotToken: ${PREPPER_BOX_TELEGRAM_BOT_TOKEN:-}
      Deployment__TelegramChatId: ${PREPPER_BOX_TELEGRAM_CHAT_ID:-}

      # IMPORTANT: these are paths on the DOCKER HOST, not inside this container. The app host asks the
      # host's daemon to create the api container, and the daemon resolves bind mounts against its own
      # filesystem. Pointing them at a path that only exists inside this container silently gives the
      # API an empty database.
      Deployment__DataPath: ${PREPPER_BOX_DATA_PATH:?PREPPER_BOX_DATA_PATH must be set (see .env.example)}
      Deployment__LogsPath: ${PREPPER_BOX_LOGS_PATH:?PREPPER_BOX_LOGS_PATH must be set (see .env.example)}

      # The dashboard requires a login token by default; it is printed in this container's logs
      # (docker logs prepper-box-apphost). Set to "true" only on a trusted network — it makes the
      # dashboard, and every log line and trace in it, readable by anyone who can reach port 15191.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "${PREPPER_BOX_DASHBOARD_ANONYMOUS:-false}"
    volumes:
      # Docker-out-of-docker: lets DCP create sibling containers on the host daemon. This grants this
      # container root-equivalent control of that daemon — acceptable on a single-tenant host running
      # only images you build, not on anything shared or internet-exposed.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── The images DCP manages ─────────────────────────────────────────────────────────────────────
  # Under the "pull" profile, so `up` never starts them — DCP owns them in deployed mode — while
  # `--profile pull pull` still fetches them.
  #
  # That indirection exists because registry credentials are CLIENT-side (~/.docker/config.json, here
  # behind Docker Desktop's credential helper), not daemon-side. DCP runs the docker CLI inside the app
  # host container, which has neither, so a pull from in there is anonymous and fails against a private
  # registry with "error from registry: unauthorized". Pulling from the host uses the login you already
  # have; the app host then finds the images present and starts them.
  #
  # These are also the full definitions for AppHost__Mode=external: delete the two `profiles:` lines and
  # compose owns the containers again (then drop the docker.sock mount above and set the mode).
  prepper-box-api:
    profiles: ["pull"]
    image: ghcr.io/hwndmaster/prepper-box-api:${PREPPER_BOX_IMAGE_TAG:-latest}
    container_name: prepper-box-api
    ports:
      - "${PREPPER_BOX_API_PORT:-5095}:8045"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://prepper-box-apphost:21192
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: prepper-box-api
      ImageSearch__SerpApiKey: ${PREPPER_BOX_SERPAPI_KEY:-}
      Telegram__BotToken: ${PREPPER_BOX_TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${PREPPER_BOX_TELEGRAM_CHAT_ID:-}
    volumes:
      - ${PREPPER_BOX_DATA_PATH}:/app/Data
      - ${PREPPER_BOX_LOGS_PATH}:/app/Logs
    restart: unless-stopped

  prepper-box-web:
    profiles: ["pull"]
    image: ghcr.io/hwndmaster/prepper-box-web:${PREPPER_BOX_IMAGE_TAG:-latest}
    container_name: prepper-box-web
    ports:
      - "${PREPPER_BOX_WEB_PORT:-5096}:8046"
      - "${PREPPER_BOX_WEB_HTTPS_PORT:-5097}:8443"
    volumes:
      - ${PREPPER_BOX_CERTS_PATH}:/etc/nginx/certs:ro
    depends_on:
      - prepper-box-api
    restart: unless-stopped
